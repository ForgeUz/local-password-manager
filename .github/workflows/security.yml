name: Security Verification

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # nightly

jobs:
  crypto-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@44ac965b0f018d799cc8fe40d76c6c53a7a5e5f9
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter test test/security/crypto/
      - run: flutter test test/security/format/
      - run: flutter test test/security/memory/
      - run: flutter test test/security/auth/
      - run: flutter test test/security/errors/

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@44ac965b0f018d799cc8fe40d76c6c53a7a5e5f9
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter test test/app/
      - run: flutter test test/vault/
      - run: flutter test test/backup/
      - run: flutter test test/os/
      - run: flutter test test/crypto/
      - run: flutter test test/lock/
      - run: flutter test test/coercion/
      - run: flutter test test/sync/
      - run: flutter test test/totp/
      - run: flutter test test/clipboard/
      - run: flutter test test/biometric/
      - run: flutter test test/passkey/
      - run: flutter test test/onboarding/
      - run: flutter test test/desktop/
      - run: flutter test test/linux/

  statemachine-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@44ac965b0f018d799cc8fe40d76c6c53a7a5e5f9
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter test test/security/statemachine/
      - run: flutter test test/security/model/
      - run: flutter test test/security/concurrency/
      - run: flutter test test/security/crash/
      - run: flutter test test/security/differential/
      - run: flutter test test/security/multivault/
      - run: flutter test test/security/attacks/
      - run: flutter test test/security/regression/

  fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@44ac965b0f018d799cc8fe40d76c6c53a7a5e5f9
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: dart run tool/fuzz_vault.dart --iterations 10000
      - run: dart run tool/fuzz_vault_grammar.dart --iterations 10000
      - run: dart run tool/fuzz_totp_import.dart --iterations 5000
      - run: dart run tool/fuzz_sync_protocol.dart --iterations 5000

  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@44ac965b0f018d799cc8fe40d76c6c53a7a5e5f9
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter test test/security/runtime/timing_test.dart
      - run: dart run tool/timing_cache.dart

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@44ac965b0f018d799cc8fe40d76c6c53a7a5e5f9
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: dart run tool/memory_dump.dart

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@44ac965b0f018d799cc8fe40d76c6c53a7a5e5f9
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: dart run tool/verify_deps.dart
      - run: dart run tool/verify_libsodium.dart

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@44ac965b0f018d799cc8fe40d76c6c53a7a5e5f9
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter analyze
      - run: dart format --set-exit-if-changed lib/
